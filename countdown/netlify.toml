[build]
  publish = "."

[[redirects]]
  from = "/sneak-peek"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/sneak-peek/"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/preview"
  to = "/index.html"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
