<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B73FF" />
      <stop offset="100%" stop-color="#4D41DF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4D41DF" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle with Shadow -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Graduation Cap (Mortarboard) -->
  <path d="M50 26 L82 40 L50 54 L18 40 Z" fill="#FFFFFF" />
  
  <!-- Cap Lower Skullcap -->
  <path d="M30 46.5 V61.5 C30 67.5 40 72 50 72 C60 72 70 67.5 70 61.5 V46.5 L50 55.5 Z" fill="#FFFFFF" fill-opacity="0.92" />
  
  <!-- Tassel Cord & Hanging Drop -->
  <path d="M74 41.5 V58 C74 60 72 62 70 62" fill="none" stroke="#FFE066" stroke-width="3" stroke-linecap="round" />
  <circle cx="70" cy="62" r="3" fill="#FFE066" />
</svg>
